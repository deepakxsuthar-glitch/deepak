services:
  - type: web
    name: deepak-portfolio-admin
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: deepak-portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/deepak.sqlite
      - key: FRONTEND_ORIGIN
        value: https://deepakxsuthar-glitch.github.io
      - key: ADMIN_EMAIL
        value: deepakxsuthar@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
